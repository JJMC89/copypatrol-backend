      musical composition\n| name             = \"{{lang|de|Kommet, ihr Hirten|italic=no}}\"\n|
      type             = German [[Christmas carol]]\n| image            = Carl Riedel
      portrait.jpg\n| image_upright    = \n| caption          = Carl Riedel, who wrote
      the text\n| translation      = \"Come, All Ye Shepherds\"\n| text             =
      by [[Carl Riedel]]\n| language         = German\n| written          = \n| based_on         =
      \"{{lang|cs|Nesem v\u00e1m noviny|italic=no}}\"\n| melody           = Bohemian\n|
      performed        = \n| published        = {{Start date|1870}}\n}}\n\"''''''{{lang|de|Kommet,
      ihr Hirten|italic=no}}''''''\" (Come, ye shepherds) is a German [[Christmas
      carol]] from [[Bohemia]] which was derived from a Czech carol, \"''''''{{lang|cs|Nesem
      v\u00e1m noviny|lit=Bringing the news|italic=no}}''''''\". It reflects elements
      from the [[nativity story]], the [[Annunciation to the shepherds]], their walk
      to the manger and [[Adoration of the Shepherds|their Adoration]], inviting to
      follow their example. The first, \"''''''{{lang|de|Kommet, ihr Hirten, ihr M\u00e4nner
      und Fraun|italic=no}}''''''\", addresses shepherds, men, and women.\n\n== History
      ==\nThe text of \"{{lang|de|Kommet, ihr Hirten|italic=no}}\" was derived from
      a Czech carol, \"{{lang|cs|Nesem v\u00e1m noviny|lit=Bringing the news|italic=no}}\".<ref
      name=\"Parent\" />{{rp|34}}<ref name=\"Radio Prag\" /> The German text was written
      as a free translation from the Czech original by [[Carl Riedel]] in [[Leipzig]].<ref
      name=\"Parent\" />{{rp|34}} It was first published under the title ''''{{lang|de|Die
      Engel und die Hirten|italic=no}}'''' (The Angels and the Shepherds) in 1870
      in his collection {{lang|de|Altb\u00f6hmische Ges\u00e4nge f\u00fcr gemischten
      Chor}} (Old-Bohemian chants for mixed choir).<ref name=\"Parent\" />{{rp|34}}
      The song is in the tradition of shepherd songs, derived from the [[Annunciation
      to the shepherds]] and the [[Adoration of the Shepherds]] from the [[Gospel
      of Luke]] (Luke 2:8-20).<ref name=\"Parent\" />{{rp|34}} Riedel''s version is
      suited for a broad public.<ref>[[Ingeborg Weber-Kellermann]]: ''''Das Buch der
      Weihnachtslieder''''. 10th edition. Atlantis, Z\u00fcrich 2003, {{ISBN|3-254-08213-3}},
      pp. 110\u2013111.</ref>\n\nThe song is still popular. It is included in the
      Protestant hymnal ''''[[Evangelisches Gesangbuch]]'''' as EG 48,<ref name=\"Parent\"
      /> and in some regional sections of the Catholic hymnal ''''[[Gotteslob (1975)|Gotteslob]]''''
      of 1975 and its second edition, the ''''[[Gotteslob]]'''' of 2013.<ref name=\"Parent\"
      />{{rp|34}}\n\nIn English, the song became known as \"Come, All Ye Shepherds\",
      translated by Mari Ruef Hofer in 1912.<ref>{{Cite web |url=http://cyberhymnal.org/htm/c/o/comeayes.htm
      |title=Come, All Ye Shepherds |access-date=2019-12-08 |archive-url=https://web.archive.org/web/20140328215723/http://cyberhymnal.org/htm/c/o/comeayes.htm
      |archive-date=2014-03-28 |url-status=dead }} bei cyberhymnal.org</ref><ref>[http://www.carols.org.uk/a09-come-all-ye-shepherds.htm
      ''''Come, All Ye Shepherds''''] bei carols.org.uk</ref>\n\n== Text ==\nThe Czech
      song \"{{lang|cs|Nesem v\u00e1m noviny|italic=no}}\" (Bringing the news) has
      five [[stanza]]s.<ref name=\"Radio Prag\" /> Riedel wrote a version in three
      stanzas of five lines each, rhyming in pairs with a concluding short last line.
      The beginning is \"{{lang|de|Kommet, ihr Hirten, ihr M\u00e4nner und Fraun|italic=no}}\"
      (Come, you shepherds, men and women).<ref name=\"Parent\" />{{rp|34}}\n\n<poem>1.
      Kommet, ihr Hirten, ihr M\u00e4nner und Fraun,\nKommet, das liebliche Kindlein
      zu schaun,\nChristus, der Herr, ist heute geboren,\nDen Gott zum Heiland euch
      hat erkoren.\nF\u00fcrchtet euch nicht!\n\n2. Lasset uns sehen in Bethlehems
      Stall,\nWas uns verhei\u00dfen der himmlische Schall;\nWas wir dort finden,
      lasset uns k\u00fcnden,\nLasset uns preisen in frommen Weisen:\nHalleluja!\n\n3.
      Wahrlich, die Engel verk\u00fcndigen heut\nBethlehems Hirtenvolk gar gro\u00dfe
      Freud:\nNun soll es werden Friede auf Erden,\nDen Menschen allen ein Wohlgefallen:\nEhre
      sei Gott!\n</poem>\n\n== Melody ==\nIn 1847, the melody was first published
      in the collection {{lang|cs|Katolicky kancion\u00e1l}} in [[Olm\u00fctz]].<ref
      name=\"Parent\" /> Manuscripts are not dated but seem to stem from the first
      half of the 19th century.<ref name=\"Ameln\">[[Konrad Ameln]]: ''''Altb\u00f6hmische
      Weihnachtslieder.'''' In: ''''{{ill|Jahrbuch f\u00fcr Liturgik und Hymnologie|de}}''''
      21 (1977), {{ISSN|0075-2681}}, {{pp.|162|165}}.</ref> It is a [[Drone (music)|bordun]]
      melody similar to folk music melodies.<ref>[[Ernst Ansch\u00fctz]]: ''''Musikalisches
      Schulgesangbuch.'''' Heft 1. Reclam, Leipzig 1824, Nr. 86, p. 33 ([http://diglib.hab.de/wdb.php?dir=drucke/un-17-1b&pointer=42
      Digitalisat] [[Herzog August Bibliothek]])</ref>\n\n<score vorbis=\"1\">\n{\n  <<\n    \\new
      Staff {\n      \\new Voice = \"singleVoice\" {\n        \\relative c'''' {\n          \\key
