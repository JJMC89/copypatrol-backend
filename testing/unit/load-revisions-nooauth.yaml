      women.\n\n== History ==\nThe text of \"{{lang|de|Kommet, ihr Hirten|italic=no}}\"
      was derived from a Czech carol, \"{{lang|cs|Nesem v\u00e1m noviny|lit=Bringing
      the news|italic=no}}\".<ref name=\"Parent\" />{{rp|34}}<ref name=\"Radio Prag\"
      /> The German text was written as a free translation from the Czech original
      by [[Carl Riedel]] in [[Leipzig]].<ref name=\"Parent\" />{{rp|34}} It was first
