      |archive-date=2014-03-28 |url-status=dead }} bei cyberhymnal.org</ref><ref>[http://www.carols.org.uk/a09-come-all-ye-shepherds.htm
      ''''Come, All Ye Shepherds''''] bei carols.org.uk</ref>\n\n== Text ==\nThe Czech
      song \"{{lang|cs|Nesem v\u00e1m noviny|italic=no}}\" (Bringing the news) has
      five [[stanza]]s.<ref name=\"Radio Prag\" /> Riedel wrote a version in three
      stanzas of five lines each, rhyming in pairs with a concluding short last line.
      The beginning is \"{{lang|de|Kommet, ihr Hirten, ihr M\u00e4nner und Fraun|italic=no}}\"
      (Come, you shepherds, men and women).<ref name=\"Parent\" />{{rp|34}}\n\n<poem
      lang=\"de\" style=\"float:left;\">Kommet, ihr Hirten, ihr M\u00e4nner und Fraun,\nKommet,
      das liebliche Kindlein zu schaun,\nChristus, der Herr, ist heute geboren,\nDen
      Gott zum Heiland euch hat erkoren.\nF\u00fcrchtet euch nicht!\n\nLasset uns
      sehen in Bethlehems Stall,\nWas uns verhei\u00dfen der himmlische Schall;\nWas
      wir dort finden, lasset uns k\u00fcnden,\nLasset uns preisen in frommen Weisen:\nHalleluja!\n\nWahrlich,
      die Engel verk\u00fcndigen heut\nBethlehems Hirtenvolk gar gro\u00dfe Freud:\nNun
      soll es werden Friede auf Erden,\nDen Menschen allen ein Wohlgefallen:\nEhre
      sei Gott!</poem>\n<poem style=\"margin-left:2em; float:left;\">Come, all ye
      shepherds, ye children of earth,\nCome ye, bring greetings to yon heavenly birth.\nFor
      Christ the Lord to all men is given,\nTo be our Savior sent down from heaven:\nCome,
      welcome Him!\n\nHasten then, hasten to Bethlehem''s stall,\nThere to see heaven
      descend to us all.\nWith holy feeling, there humbly kneeling,\nWe will adore
      Him, bow down before Him,\nWorship the King.\n\nAngels and shepherds together
      we go\nSeeking the Savior from all earthly woe;\nWhile angels, winging, His
      praise are singing,\nHeaven''s echoes ringing, peace on earth bringing,\nGood
      will to men.</poem>{{clear|left}}\n\n== Melody ==\nIn 1847, the melody was first
      published in the collection {{lang|cs|Katolicky kancion\u00e1l}} in [[Olm\u00fctz]].<ref
      name=\"Parent\" /> Manuscripts are not dated but seem to stem from the first
      half of the 19th century.<ref name=\"Ameln\">[[Konrad Ameln]]: ''''Altb\u00f6hmische
      Weihnachtslieder.'''' In: ''''{{ill|Jahrbuch f\u00fcr Liturgik und Hymnologie|de}}''''
      21 (1977), {{ISSN|0075-2681}}, {{pp.|162|165}}.</ref> It is a [[Drone (music)|bordun]]
      melody similar to folk music melodies.<ref>[[Ernst Ansch\u00fctz]]: ''''Musikalisches
      Schulgesangbuch.'''' Heft 1. Reclam, Leipzig 1824, Nr. 86, p. 33 ([http://diglib.hab.de/wdb.php?dir=drucke/un-17-1b&pointer=42
      Digitalisat] [[Herzog August Bibliothek]])</ref>\n\n<score sound=\"1\" raw=\"1\">\n\\header
