      d[( bes]) c4 c8[( a]) d[( bes]) c4 a8[( c]) g[( a]) f2 r4\n          }\n          f4
      a8 f a c f,4 a8 f g c,\n          f4 a8 f a c f,4 a8 f g c,\n          c''4
      a8[( c]) g[( a]) f2 r4 \\bar \"|.\"\n        }\n      }\n    }\n    \\new Lyrics
