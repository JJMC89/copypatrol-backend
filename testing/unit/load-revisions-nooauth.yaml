      (The Angels and the Shepherds) in 1870 in his collection {{lang|de|Altb\u00f6hmische
      Ges\u00e4nge f\u00fcr gemischten Chor}} (Old-Bohemian chants for mixed choir).<ref
      name=\"Parent\" />{{rp|34}} The song is in the tradition of shepherd songs,
      derived from the [[Annunciation to the shepherds]] and the [[Adoration of the
      Shepherds]] from the [[Gospel of Luke]] (Luke 2:8-20).<ref name=\"Parent\" />{{rp|34}}
      Riedel''s version is suited for a broad public.<ref>[[Ingeborg Weber-Kellermann]]:
      ''''Das Buch der Weihnachtslieder''''. 10th edition. Atlantis, Z\u00fcrich 2003,
      {{ISBN|3-254-08213-3}}, pp. 110\u2013111.</ref>\n\nThe song is still popular.
      It is included in the Protestant hymnal ''''[[Evangelisches Gesangbuch]]''''
      as EG 48,<ref name=\"Parent\" /> and in some regional sections of the Catholic
      hymnal ''''[[Gotteslob (1975)|Gotteslob]]'''' of 1975 and its second edition,
      the ''''[[Gotteslob]]'''' of 2013.<ref name=\"Parent\" />{{rp|34}}\n\nIn English,
      the song became known as \"Come, All Ye Shepherds\", translated by Mari Ruef
      Hofer in 1912.<ref>{{Cite web |url=http://cyberhymnal.org/htm/c/o/comeayes.htm
