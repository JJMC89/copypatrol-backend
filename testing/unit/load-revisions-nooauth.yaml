      Herr, ist heu -- te ge -- bo -- ren,\n      Den Gott zum Hei -- land euch hat
      er -- ko -- ren.\n      F\u00fcrch -- tet__ euch__ nicht!\n    }\n  >>\n} </score>\n<!--\nEine
